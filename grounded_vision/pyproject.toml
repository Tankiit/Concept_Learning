[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded_vision"
version = "0.1.0"
description = "Grounded Relational Vision Framework for Certifiable Natural Language Explanations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.2.0",
    "pyyaml>=6.0",
    "pillow>=9.0.0",
    "matplotlib>=3.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "jupyter>=1.0.0"
]
pyxai = [
    "pyxai"
]

[tool.setuptools.packages.find]
where = ["src"]
