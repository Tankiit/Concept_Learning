# Configuration: CUB Flat (Standard Global Concept Bottleneck Baseline)
experiment:
  name: "cub_flat"
  representation: "flat"
  seed: 42

data:
  dataset: "cub_200_2011"
  data_dir: "data/CUB_200_2011"
  cache_dir: "cache/cub_flat"
  image_size: 224
  num_classes: 200
  num_attributes: 312
  use_mock_if_missing: true

perception:
  backbone: "dinov2_vits14"
  embedding_dim: 384
  patch_size: 14
  part_detection: false
  num_prototypes_per_attribute: 5

predicates:
  representation_mode: "flat"
  probability_threshold: 0.5
  include_part_binding: false
  include_relations: false

reasoning:
  model_type: "decision_tree"
  max_depth: 10
  min_samples_leaf: 5
  criterion: "gini"
  enforce_domain_constraints: true

explanations:
  backend: "tree_verifier"  # "pyxai" or "tree_verifier"
  max_conditions: 6
  find_contrastive: true
  evidence_crops: true

language:
  template_style: "scientific"
  decoder_model: "rule_based"
  strict_faithfulness_audit: true
