# Configuration: CUB Relational (Part-Bound + PartOf Hierarchy + Spatial Relations)
experiment:
  name: "cub_relational"
  representation: "relational"
  seed: 42

data:
  dataset: "cub_200_2011"
  data_dir: "data/CUB_200_2011"
  cache_dir: "cache/cub_relational"
  image_size: 224
  num_classes: 200
  num_parts: 15
  num_attributes: 312
  use_mock_if_missing: true

perception:
  backbone: "dinov2_vits14"
  embedding_dim: 384
  patch_size: 14
  part_detection: true
  num_prototypes_per_attribute: 5
  roi_pool_size: 7

predicates:
  representation_mode: "relational"
  probability_threshold: 0.5
  include_part_binding: true
  include_relations: true
  relation_types:
    - "part_of"
    - "above"
    - "below"
    - "left_of"
    - "right_of"
    - "adjacent_to"
  track_provenance: true

reasoning:
  model_type: "decision_tree"
  max_depth: 14
  min_samples_leaf: 3
  criterion: "gini"
  enforce_domain_constraints: true

explanations:
  backend: "tree_verifier"
  max_conditions: 8
  find_contrastive: true
  evidence_crops: true

language:
  template_style: "scientific_relational"
  decoder_model: "rule_based"
  strict_faithfulness_audit: true
