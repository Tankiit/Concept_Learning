# Full run configuration: real CUB-200-2011 data, no synthetic fallback.
experiment:
  name: "cub_bound_real_full"
  representation: "bound"
  seed: 42

data:
  dataset: "cub_200_2011"
  data_dir: "/Users/cril/tanmoy/research/data/CUB_200_2011/CUB_200_2011"
  cache_dir: "/Users/cril/tanmoy/research/data/grounded_vision_runs/cub_bound_real_full"
  image_size: 224
  num_classes: 200
  num_parts: 15
  num_attributes: 312
  use_mock_if_missing: false

perception:
  backbone: "dinov2_vits14"
  embedding_dim: 384
  patch_size: 14
  part_detection: true
  num_prototypes_per_attribute: 5
  roi_pool_size: 7

predicates:
  representation_mode: "bound"
  probability_threshold: 0.5
  include_part_binding: true
  include_relations: false
  track_provenance: true

reasoning:
  model_type: "decision_tree"
  max_depth: 12
  min_samples_leaf: 4
  criterion: "gini"
  enforce_domain_constraints: true

explanations:
  backend: "tree_verifier"
  max_conditions: 6
  find_contrastive: true
  evidence_crops: true

language:
  template_style: "scientific"
  decoder_model: "rule_based"
  strict_faithfulness_audit: true
